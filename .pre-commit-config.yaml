repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: validate-el-syntax
        name: Validate Emacs Lisp syntax
        entry: bash -c 'emacs --batch --eval "(progn (find-file \"init.el\") (check-parens) (message \"OK\"))" && emacs --batch --eval "(progn (find-file \"early-init.el\") (check-parens) (message \"OK\"))"'
        language: system
        files: ^(init|early-init)\.el$
        pass_filenames: false
      - id: trufflehog
        name: TruffleHog
        description: Detect secrets in your data.
        entry: bash -c "trufflehog git file://. --since-commit HEAD --only-verified --fail"
        language: system
        stages: ["pre-commit", "pre-push"]

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.23.1
    hooks:
      - id: zizmor

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: '44.30.4'
    hooks:
      - id: renovate-config-validator
